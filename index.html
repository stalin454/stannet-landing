<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StanNet.Space — Web · AI · Cybersecurity · Music</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      text-align: center;
      position: relative;
    }
    .background-cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.35;
      z-index: 1;
      filter: blur(1px);
    }
    .main-container {
      position: relative;
      z-index: 2;
      padding: 2.5rem 1.5rem;
      max-width: 900px;
      width: 90%;
      background: rgba(10, 15, 29, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 20px;
      box-shadow: 0 0 50px rgba(0, 212, 255, 0.15);
    }
    .preview-card {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.3);
      margin-bottom: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    .preview-card img {
      width: 100%;
      height: auto;
      display: block;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .pillars {
      color: #38bdf8;
      font-size: 1rem;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }
    .badge {
      display: inline-block;
      padding: 0.4rem 1.2rem;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid #38bdf8;
      border-radius: 9999px;
      color: #7dd3fc;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 2rem;
    }
    .action-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }
    .btn {
      padding: 0.85rem 1.8rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary {
      background: #0284c7;
      color: white;
      box-shadow: 0 0 20px rgba(2, 132, 199, 0.4);
    }
    .btn-primary:hover {
      background: #0369a1;
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <img src="bg-stannet.jpg" alt="StanNet Background" class="background-cover">

  <div class="main-container">
    <div class="preview-card">
      <img src="bg-stannet.jpg" alt="StanNet Space Official Banner">
    </div>

    <h1>STANNET.SPACE</h1>
    <p class="pillars">Web · AI · Cybersecurity · Music</p>
    <div class="badge">🚀 PRÓXIMAMENTE / EN CONSTRUCCIÓN</div>

    <div class="action-links">
      <a href="https://youtube.com/@StanNetOfficial" target="_blank" class="btn btn-primary">
        ▶ Canal de YouTube
      </a>
      <a href="mailto:contacto@stannet.space" class="btn btn-secondary">
        ✉ Contacto Profesional
      </a>
    </div>
  </div>
</body>
</html>
