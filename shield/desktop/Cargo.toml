[package]
name = "stannet-shield"
version = "0.1.0"
edition = "2021"
description = "Defensive on-demand scanner core for StanNet Shield"

[dependencies]
sha2 = "0.10"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
