name: Guided Academy independent preview (no production routes)

on:
  push:
    branches: [feat/academy-guided-learning-20261017]
    paths:
      - '.github/workflows/academy-guided-preview.yml'
      - 'wrangler.academy-guided-preview.jsonc'
      - 'pages/programming*'
      - 'programming-*'
      - 'tests/programming*'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: academy-guided-preview
  cancel-in-progress: true

jobs:
  preview:
    if: github.repository == 'stalin454/stannet-landing'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify evaluations before publishing candidate
        run: |
          node --check programming-lab.js
          node --check programming-python-worker.js
          node --check programming-web-lab.js
          python3 -m py_compile programming-python-evaluator.py
          npm run test:ci
      - name: Stage only public academy assets (never the repository)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _academy_guided_preview
          for f in pages/programming.html pages/programming-lab.html pages/programming-web-lab.html programming-*.js programming-*.css programming-*.py style.css ios-responsive.css stannet-global-theme.css navigation-performance.css stannet-global-nav.js stannet-discovery.js stannet-discovery.css assets/brand/stannet-sn-cutout-20261005.png assets/brand/stannet-sn-cutout-32.png assets/brand/stannet-sn-cutout-180.png; do
            test -f "$f" || exit 1
            cp --parents "$f" _academy_guided_preview/
          done
          cp programming-python-evaluator.py _academy_guided_preview/programming-python-evaluator.txt
          cat > _academy_guided_preview/index.html <<'HTML'
          <!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>StanNet Academy — preview</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#061325;color:#f0f8ff;font-family:system-ui,sans-serif}main{max-width:680px;padding:3rem 1.5rem}h1{font-size:clamp(2rem,5vw,3.5rem);margin:0 0 .5rem}p{color:#c4d9e9;line-height:1.6}nav{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1.8rem}a{padding:.8rem 1.1rem;border-radius:10px;background:#10638e;color:#fff;text-decoration:none;font-weight:700}a:focus-visible{outline:3px solid #55ccff}</style></head><body><main><h1>StanNet Programming Academy</h1><p>Vista aislada para probar Python guiado y la vista en vivo del laboratorio web. No es producción, no incluye autenticación ni pagos.</p><nav><a href="/pages/programming-lab.html">Probar Python guiado</a><a href="/pages/programming-web-lab.html">Probar HTML, CSS y JavaScript</a></nav></main></body></html>
          HTML
          cat > _academy_guided_preview/_headers <<'HEADERS'
          /*
            X-Robots-Tag: noindex, nofollow
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
          HEADERS
      - name: Deploy separate workers.dev preview only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.139.0'
          command: deploy --config wrangler.academy-guided-preview.jsonc
      - name: Verify the independent deployment
        shell: bash
        run: |
          set -euo pipefail
          origin="https://stannet-academy-guided-preview.stalin454.workers.dev"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 25 "$origin/pages/programming-lab.html" -o /tmp/guided-python.html; then break; fi
            sleep 8
          done
          grep -q 'id="pa-guide"' /tmp/guided-python.html
          curl -fsSL "$origin/programming-python-evaluator.txt" -o /tmp/guided-evaluator.py
          grep -q 'def evaluate' /tmp/guided-evaluator.py
          curl -fsSL "$origin/pages/programming-web-lab.html" -o /tmp/guided-web.html
          grep -q 'id="web-live-toggle"' /tmp/guided-web.html
          echo "PASS: independent preview at $origin"
