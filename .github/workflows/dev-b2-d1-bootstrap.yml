name: StanNet Dev B2 - provision isolated D1 once
# Archived after successful provisioning. Never provision on PR synchronize.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stannet-dev-b2-isolated-d1-provision
  cancel-in-progress: false

jobs:
  provision:
    # Recovery receipt retained; the existing database must not be re-adopted.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify code and tests before any remote write
        run: |
          python3 docs/dev-b1/verify-isolation.py
          npm test --prefix apps/dev-b1
          node --check apps/dev-b1/worker.mjs
      - name: Install isolated pinned D1 migration CLI (no secrets supplied)
        run: npm install --prefix /tmp/stannet-dev-b2-cli --no-save --no-audit --no-fund wrangler@4.139.0
      - name: Check operator-confirmed free account scope and create exactly one dedicated database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEV_D1_TOKEN: ${{ secrets.CLOUDFLARE_DEV_D1_TOKEN }}
        run: |
          set -eu
          python3 - <<'PY'
          import os,datetime
          expected = 'afd3fa221e7bdb515ea79806eea35769'
          if os.environ.get('CLOUDFLARE_ACCOUNT_ID') != expected:
              raise SystemExit('STOP: account differs from confirmed Cloudflare Workers/D1 dashboard; no write')
          if not os.environ.get('CLOUDFLARE_DEV_D1_TOKEN'):
              raise SystemExit('STOP: dedicated D1 secret missing; no write')
          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          if today != '2026-10-14':
              raise SystemExit('STOP: free D1 quota confirmation is from 2026-10-14 UTC and must be renewed; no write')
          print('Free quota and zero remote databases confirmed by owner screenshot; account matched, proceeding with isolated destination only.')
          PY
          python3 apps/dev-b1/d1-bootstrap.py create --confirmed-free --confirmed-on 2026-10-14
      - name: Initialize only the newly created D1, verify identity and integrity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEV_D1_TOKEN: ${{ secrets.CLOUDFLARE_DEV_D1_TOKEN }}
        run: |
          set -eu
          python3 apps/dev-b1/d1-bootstrap.py initialize --wrangler /tmp/stannet-dev-b2-cli/node_modules/.bin/wrangler
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('apps/dev-b1/.state/d1-target.json').read_text())
          assert r['database_name']=='stannet-dev-b1-sandbox' and r['schema_initialized'] and not r['auth_enabled'] and not r['worker_deployed']
          print('Remote dedicated D1 schema initialized; authentication and worker deployment remain DISABLED.')
          PY
      - name: Preserve recovery receipt even if migrations fail (no secrets or user records)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stannet-dev-b2-new-d1-recovery-receipt
          path: apps/dev-b1/.state/d1-target.json
          if-no-files-found: ignore
          retention-days: 7
