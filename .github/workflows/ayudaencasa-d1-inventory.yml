name: AyudaEnCasa D1 staging inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ayudaencasa-d1-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check isolated staging database inventory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo 'Cloudflare credentials are not configured for staging inventory'; exit 1
          fi
          curl --silent --show-error --fail --retry 2 --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100" \
            -o /tmp/aec-d1-list.json
          jq -e '.success == true' /tmp/aec-d1-list.json >/dev/null
          jq -r '[.result[] | select(.name | test("ayuda|casa"; "i"))] as $matches | if ($matches | length)==0 then "NO_AYUDA_DATABASE" else ($matches[] | "D1_MATCH name=\(.name) id=\(.uuid)") end' /tmp/aec-d1-list.json
          rm -f /tmp/aec-d1-list.json
