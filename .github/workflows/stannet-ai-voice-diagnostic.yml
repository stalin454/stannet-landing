name: StanNet AI speech diagnostic (read-only)
on:
  pull_request:
    paths:
      - tests/stannet-ai-voice-live-status.mjs
      - .github/workflows/stannet-ai-voice-diagnostic.yml
      - stannet-ai.js
      - stannet-ai.css
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read voice provider status and anonymous login requirement (no Polly calls)
        run: node tests/stannet-ai-voice-live-status.mjs
