name: Dev B1 isolated release
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/dev-b1-release.yml'
      - 'apps/dev-b1/cloudflare-inventory.py'
      - 'apps/dev-b1/portal-public/**'
      - 'apps/dev-b1/build-portal.mjs'
      - 'apps/dev-b1/public/site.css'
      - 'apps/dev-b1/public/logo.png'
      - 'apps/dev-b1/public/orbitron*'
      - 'apps/dev-b1/portal-*.jsonc'
      - 'apps/dev-b1/release-guard.py'
      - 'apps/dev-b1/tests/portal-browser.cjs'
permissions:
  contents: read
concurrency:
  group: stannet-dev-b1-isolated-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'stalin454/stannet-landing' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/stannet-dev-b1-20261014'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify protected source and baseline recovery
        run: python3 docs/dev-b1/verify-isolation.py
      - name: Existing application regression tests
        run: npm run test:ci
      - name: Isolated auth and security tests
        working-directory: apps/dev-b1
        run: npm test
      - name: Build completed public module only
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: node apps/dev-b1/build-portal.mjs
      - name: Prepare Chrome driver for QA (not a production dependency)
        run: npm install --prefix /tmp/dev-b1-browser --no-save --no-audit --no-fund puppeteer-core@24
      - name: Browser QA before publication (320, 390, 1280)
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          NODE_PATH: /tmp/dev-b1-browser/node_modules
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory apps/dev-b1/site-build >/tmp/dev-b1-http.log 2>&1 &
          node apps/dev-b1/tests/portal-browser.cjs
      - name: Inspect Dev destination only (read-only, no secret output)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 apps/dev-b1/cloudflare-inventory.py
      - name: Confirm destination and snapshot protected deployment metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 apps/dev-b1/release-guard.py before
      - name: Publish isolated candidate without any domain route
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.139.0'
          command: deploy --config ${{ env.DEV_CANDIDATE_CONFIG }}
      - name: Verify candidate in real Chrome before binding root Dev
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          NODE_PATH: /tmp/dev-b1-browser/node_modules
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          QA_BASE_URL="$DEV_CANDIDATE_URL" node apps/dev-b1/tests/portal-browser.cjs
      - name: Bind verified portal exclusively to stannet.dev
        if: env.DEV_DOMAIN_ALLOWED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.139.0'
          command: deploy --config apps/dev-b1/portal-domain.jsonc
      - name: Verify public domain HTTP and committed version
        if: env.DEV_DOMAIN_ALLOWED == 'true'
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,time,os
          for attempt in range(12):
            try:
              with urllib.request.urlopen('https://stannet.dev/version.json',timeout=12) as r:
                d=json.load(r)
              assert d['commit']==os.environ['SOURCE_COMMIT'] and d['auth'] is False and d['payments'] is False
              print(json.dumps({'domain':'https://stannet.dev','http_verified':True,'source_commit':d['commit']}));break
            except Exception:
              if attempt==11:raise
              time.sleep(5)
          PY
      - name: Verify published Dev in real Chrome (320, 390, 1280)
        if: env.DEV_DOMAIN_ALLOWED == 'true'
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          NODE_PATH: /tmp/dev-b1-browser/node_modules
          CHROME_PATH: /usr/bin/google-chrome
          QA_BASE_URL: https://stannet.dev
        run: node apps/dev-b1/tests/portal-browser.cjs
      - name: Verify Space and academy production deployment unchanged
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 apps/dev-b1/release-guard.py after
      - name: Roll back Dev only if critical publication checks fail
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 apps/dev-b1/release-guard.py rollback
