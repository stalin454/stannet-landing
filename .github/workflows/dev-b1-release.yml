name: Dev B1 isolated release
on:
  pull_request:
    branches: [feat/london-english-dev-20261019, main, feat/stannet-dev-open-learning-20261015, feat/stannet-dev-artists-seo-20261017]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/dev-b1-release.yml'
      - 'infinity/**'
      - 'apps/dev-b1/devtube/**'
      - 'apps/dev-b1/tests/devtube-browser.cjs'
      - 'apps/dev-b1/catalog.mjs'
      - 'apps/dev-b1/tests/infinity-browser.cjs'
      - 'apps/dev-b1/cloudflare-inventory.py'
      - 'apps/dev-b1/portal-public/**'
      - 'apps/dev-b1/artist-public/**'
      - 'apps/dev-b1/artist-videos.json'
      - 'apps/dev-b1/build-portal.mjs'
      - 'apps/dev-b1/denmark-open.mjs'
      - 'apps/dev-b1/programming-radio-open.mjs'
      - 'apps/dev-b1/public/site.css'
      - 'apps/dev-b1/public/logo.png'
      - 'apps/dev-b1/public/orbitron*'
      - 'apps/dev-b1/portal-*.jsonc'
      - 'apps/dev-b1/release-guard.py'
      - 'apps/dev-b1/release-needed.py'
      - 'apps/dev-b1/cloudflare-read.py'
      - 'apps/dev-b1/tests/portal-browser.cjs'
permissions:
  contents: read
concurrency:
  group: stannet-dev-b1-isolated-release
  cancel-in-progress: false
jobs:
  changes:
    if: github.repository == 'stalin454/stannet-landing' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'feat/stannet-infinity-production-20261021' || github.head_ref == 'fix/dev-artist-universe-csp-20261017' || github.head_ref == 'feat/stannet-dev-b1-20261014' || github.head_ref == 'feat/stannet-dev-open-learning-20261015' || github.head_ref == 'feat/stannet-dev-artists-seo-20261017')
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.gate.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: gate
        name: Compare public source with the deployed receipt
        run: python3 apps/dev-b1/release-needed.py
  release:
    needs: changes
    if: needs.changes.outputs.needed == 'true' && github.repository == 'stalin454/stannet-landing' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'feat/stannet-infinity-production-20261021' || github.head_ref == 'fix/dev-artist-universe-csp-20261017' || github.head_ref == 'feat/stannet-dev-b1-20261014' || github.head_ref == 'feat/stannet-dev-open-learning-20261015' || github.head_ref == 'feat/stannet-dev-artists-seo-20261017')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify protected source and baseline recovery
        run: python3 docs/dev-b1/verify-isolation.py
      - name: Existing application regression tests
        run: npm run test:ci
      - name: Isolated auth and security tests
        working-directory: apps/dev-b1
        run: npm test
      - name: Build completed public module only
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: node apps/dev-b1/build-portal.mjs
      - name: Prepare Chrome driver for QA (not a production dependency)
        run: npm install --prefix /tmp/dev-b1-browser --no-save --no-audit --no-fund puppeteer-core@24
      - name: Capture current Artist Universe before repair
        env:
          NODE_PATH: /tmp/dev-b1-browser/node_modules
          CHROME_PATH: /usr/bin/google-chrome
          QA_BASE_URL: https://stannet.dev
          QA_ARTISTS_BASELINE: '1'
        run: node apps/dev-b1/tests/artist-universe-browser.cjs
      - name: Browser QA before publication (320, 390, 768, 1280, 1440)
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          NODE_PATH: /tmp/dev-b1-browser/node_modules
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory apps/dev-b1/site-build >/tmp/dev-b1-http.log 2>&1 &
          node apps/dev-b1/tests/portal-browser.cjs
      - name: Inspect Dev destination only (read-only, no secret output)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEV_D1_TOKEN: ${{ secrets.CLOUDFLARE_DEV_D1_TOKEN }}
        run: python3 apps/dev-b1/cloudflare-inventory.py
      - name: Reject stale Dev baseline before any deployment
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYCODE'
          import json,os,urllib.request
          req=urllib.request.Request('https://stannet.dev/version.json',headers={'User-Agent':'StanNet-Dev-Release-QA/1.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=25) as response: current=json.load(response)['commit']
          assert current in ['f31145e7a206b10ca61194da825a2197204931d9','8f4d68f7fb4332f0933a45f0a7dc639cb2013e3c','7de882e006d3879a4aaced6bf7f13f307af52b50','0705afe510ba90d31ce99fc4c23eb1f4ff214126','1f34ade2b898e5054b79e8d8c37807cdd2e471a4','1db1710876ae0242e8dc0a5debb4c1193b9f6777','a8ca300c037b7a49f76f5111ae186ef7bfe78fd1','70017ffbf10f1978beabda90639610f839912562','4aaa01691b66fcd14aba20700eed85f8dbcf8176',os.environ['SOURCE_COMMIT']], 'Dev changed since last verified Infinity release; stop before publication'
          print('Current Dev matches the preserved baseline or this exact release.')
          PYCODE
      - name: Confirm destination and snapshot protected deployment metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEV_DNS_READ_TOKEN: ${{ secrets.CLOUDFLARE_DEV_DNS_READ_TOKEN }}
        run: python3 apps/dev-b1/release-guard.py before
      - name: Publish isolated candidate without any domain route
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.139.0'
          command: deploy --config ${{ env.DEV_CANDIDATE_CONFIG }}
      - name: Verify candidate in real Chrome before binding root Dev
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          NODE_PATH: /tmp/dev-b1-browser/node_modules
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          python3 - <<'PY'
          import urllib.request,json,time,os
          base=os.environ['DEV_CANDIDATE_URL']
          for attempt in range(12):
            try:
              request=urllib.request.Request(base+'/version.json',headers={'User-Agent':'StanNet-Dev-Release-QA/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=12) as response:
                version=json.load(response)
              assert version['commit']==os.environ['SOURCE_COMMIT']
              request=urllib.request.Request(base+'/',headers={'User-Agent':'StanNet-Dev-Release-QA/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=12) as response:
                assert response.status==200
              print('Candidate HTTP and source commit verified after propagation.');break
            except Exception:
              if attempt==11:raise
              time.sleep(5)
          PY
          QA_BASE_URL="$DEV_CANDIDATE_URL" node apps/dev-b1/tests/portal-browser.cjs
      - name: Recheck apex snapshot immediately before binding
        if: env.DEV_DOMAIN_ALLOWED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEV_DNS_READ_TOKEN: ${{ secrets.CLOUDFLARE_DEV_DNS_READ_TOKEN }}
        run: python3 apps/dev-b1/release-guard.py bind-check
      - name: Bind verified portal exclusively to stannet.dev
        if: env.DEV_DOMAIN_ALLOWED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.139.0'
          command: deploy --config apps/dev-b1/portal-domain.jsonc
      - name: Verify public domain HTTP and committed version
        if: env.DEV_DOMAIN_ALLOWED == 'true'
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,time,os
          for attempt in range(12):
            try:
              request=urllib.request.Request('https://stannet.dev/version.json',headers={'User-Agent':'StanNet-Dev-Release-QA/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=12) as r:
                d=json.load(r)
              assert d['commit']==os.environ['SOURCE_COMMIT'] and d['auth'] is False and d['payments'] is False
              print(json.dumps({'domain':'https://stannet.dev','http_verified':True,'source_commit':d['commit']}));break
            except Exception:
              if attempt==11:raise
              time.sleep(5)
          PY
      - name: Verify published Dev in real Chrome (320, 390, 768, 1280, 1440)
        if: env.DEV_DOMAIN_ALLOWED == 'true'
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          NODE_PATH: /tmp/dev-b1-browser/node_modules
          CHROME_PATH: /usr/bin/google-chrome
          QA_BASE_URL: https://stannet.dev
        run: node apps/dev-b1/tests/portal-browser.cjs
      - name: Verify Space and academy production deployment unchanged
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEV_DNS_READ_TOKEN: ${{ secrets.CLOUDFLARE_DEV_DNS_READ_TOKEN }}
        run: python3 apps/dev-b1/release-guard.py after
      - name: Roll back Dev only if critical publication checks fail
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEV_DNS_READ_TOKEN: ${{ secrets.CLOUDFLARE_DEV_DNS_READ_TOKEN }}
        run: python3 apps/dev-b1/release-guard.py rollback

      - name: Keep release evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-artists-release-evidence
          path: |
            /tmp/dev-b1-before.json
            apps/dev-b1/qa-evidence/
          if-no-files-found: warn
