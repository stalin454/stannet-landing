name: Password Vault isolated browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/password-vault-isolated-browser.cjs'
      - '.github/workflows/password-vault-isolated.yml'
      - 'password-security.js'
      - 'pages/password-security.html'
      - 'password-security.css'
permissions:
  contents: read
jobs:
  local-vault-regression:
    if: github.repository == 'stalin454/stannet-landing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate encrypted vault JavaScript syntax
        run: node --check password-security.js
      - name: Install Chrome automation (testing only)
        run: npm install --prefix /tmp/vault-browser --no-save --no-audit --no-fund puppeteer-core@24
      - name: Test original Space vault with dummy data and offline sync
        env:
          NODE_PATH: /tmp/vault-browser/node_modules
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/vault-http.log 2>&1 &
          node tests/password-vault-isolated-browser.cjs
