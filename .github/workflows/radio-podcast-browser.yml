name: Private radio podcast browser QA
on:
  pull_request:
    paths:
      - radio-podcast.js
      - radio.js
      - radio.css
      - pages/radio.html
      - assets/radio/podcasts/**
      - tests/radio-podcast-browser.cjs
      - .github/workflows/radio-podcast-browser.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/stannet-podcast --no-save --no-audit --no-fund puppeteer-core@24
      - name: Check protected editor, preview, downloads and upload states
        env:
          NODE_PATH: /tmp/stannet-podcast/node_modules
          CHROME_PATH: /usr/bin/google-chrome
          STANNET_AUDIT_URL: http://127.0.0.1:8765/
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/stannet-podcast-server.log 2>&1 &
          node tests/radio-podcast-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radio-podcast-screenshots
          path: output/radio-podcast/
          if-no-files-found: ignore
