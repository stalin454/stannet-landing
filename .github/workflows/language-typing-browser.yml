name: Language Typing & Shadowing browser QA
on:
  pull_request:
    paths:
      - 'language-typing*.js'
      - 'language-typing.css'
      - 'pages/language-typing.html'
      - 'pages/typing-stories.html'
      - 'typing-stories*.js'
      - 'typing-stories.css'
      - 'tests/typing-stories*.cjs'
      - 'pages/typing.html'
      - 'tests/language-typing*.cjs'
      - '.github/workflows/language-typing-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  language-typing-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate language curriculum and scripts
        run: |
          node --check language-typing.js
          node --check language-typing-data.js
          node tests/language-typing.test.cjs
      - name: Install Chrome driver
        run: npm install --prefix /tmp/stannet-language-browser --no-save --no-audit --no-fund puppeteer-core@24
      - name: Chrome mobile and desktop classroom audit
        env:
          NODE_PATH: /tmp/stannet-language-browser/node_modules
          CHROME_PATH: /usr/bin/google-chrome
          STANNET_AUDIT_URL: http://127.0.0.1:8765/
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/stannet-language.log 2>&1 &
          sleep 2
          node tests/language-typing-browser.cjs
          node tests/typing-stories-browser.cjs
      - name: Screenshots and QA report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: language-typing-evidence
          path: output/language-typing-browser/
          if-no-files-found: ignore
