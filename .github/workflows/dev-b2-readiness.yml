name: StanNet Dev B2 read-only readiness
on:
  pull_request:
    branches: [feat/stannet-dev-b1-20261014]
    paths: ['apps/dev-b1/**', '.github/workflows/dev-b2-readiness.yml']
permissions:
  contents: read
concurrency:
  group: stannet-dev-b2-read-only-readiness
  cancel-in-progress: true
jobs:
  inspect:
    if: >-
      github.repository == 'stalin454/stannet-landing' &&
      github.event.pull_request.number == 153 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/stannet-dev-b2-typing-d1-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify read-only target constraints with synthetic responses
        run: python3 apps/dev-b1/tests/readiness.test.py
      - name: Inspect only verified sandbox identity and metadata; no migrations/deployment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEV_D1_TOKEN: ${{ secrets.CLOUDFLARE_DEV_D1_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 apps/dev-b1/readiness.py
