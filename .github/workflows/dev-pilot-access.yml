name: Dev pilot read-only access
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/dev-pilot-access.yml'
      - 'apps/dev-b1/pilot-access.py'
permissions:
  contents: read
concurrency:
  group: dev-pilot-read-only-access
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'stalin454/stannet-landing' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/dev-typing-pilot-20261015'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Read Dev metadata only; never create, deploy or query user data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEV_D1_TOKEN: ${{ secrets.CLOUDFLARE_DEV_D1_TOKEN }}
          CLOUDFLARE_DEV_DNS_READ_TOKEN: ${{ secrets.CLOUDFLARE_DEV_DNS_READ_TOKEN }}
        run: python3 apps/dev-b1/pilot-access.py
