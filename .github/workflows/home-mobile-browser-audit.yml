name: Home mobile responsive browser audit
on:
  pull_request:
    paths:
      - tests/home-mobile-live.cjs
      - .github/workflows/home-mobile-browser-audit.yml
      - home-refresh.css
      - index.html
      - stannet-global-nav.js
      - stannet-ai*.js
      - stannet-ai*.mjs
      - stannet-ai.css
      - programming-*.js
      - qa/stannet-ai/**
      - qa/context-bridge/**
      - tests/stannet-ai-context-browser.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Add browser driver
        run: npm install --prefix /tmp/stannet-mobile-browser --no-save --no-audit --no-fund puppeteer-core@24
      - name: Audit real StanNet homepage in emulated phones
        env:
          NODE_PATH: /tmp/stannet-mobile-browser/node_modules
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/stannet-home-preview.log 2>&1 &
          sleep 2
          STANNET_AUDIT_URL=http://127.0.0.1:8765/ node tests/home-mobile-live.cjs

      - name: Verify Context Bridge and agent mobile keyboard/scroll matrix
        env:
          NODE_PATH: /tmp/stannet-mobile-browser/node_modules
          CHROME_PATH: /usr/bin/google-chrome
          STANNET_AUDIT_URL: http://127.0.0.1:8765/
        run: node tests/stannet-ai-context-browser.cjs
      - name: Validate Polly sign-in, natural voice selection and opt-in costs
        env:
          NODE_PATH: /tmp/stannet-mobile-browser/node_modules
          CHROME_PATH: /usr/bin/google-chrome
          STANNET_AUDIT_URL: http://127.0.0.1:8765/
        run: node tests/stannet-ai-voice-browser.cjs
      - name: Keep Context Bridge browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stannet-ai-context-browser
          path: output/context-bridge-browser/
          if-no-files-found: ignore
