name: Shield Desktop Rust
on:
  pull_request:
    paths:
      - 'shield/desktop/**'
      - '.github/workflows/shield-desktop-rust.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: shield/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test defensive core
        run: cargo test
      - name: Build core
        run: cargo build --release
      - name: Defensive end-to-end smoke tests
        shell: pwsh
        run: |
          Set-Content shield-clean.txt 'StanNet Shield ordinary defensive smoke test'
          $clean = (& .\target\release\stannet-shield.exe scan shield-clean.txt) | ConvertFrom-Json
          if ($clean.status -ne 'no-rule-match' -or $clean.sha256.Length -ne 64) { throw 'Clean scan failed' }
          Set-Content shield-yara.txt 'STANNET_SHIELD_DEMO'
          $fixture = (& .\target\release\stannet-shield.exe scan shield-yara.txt) | ConvertFrom-Json
          if ($fixture.status -ne 'review' -or $fixture.matches -notcontains 'Shield_Demo') { throw 'YARA-X fixture failed' }
          New-Item -ItemType Directory -Force q | Out-Null
          Set-Content quarantine-me.txt 'benign quarantine roundtrip fixture'
          $record = (& .\target\release\stannet-shield.exe quarantine quarantine-me.txt q 'test only') | ConvertFrom-Json
          if (Test-Path quarantine-me.txt) { throw 'Quarantine did not isolate source' }
          & .\target\release\stannet-shield.exe restore (Join-Path 'q' $record.id 'record.json')
          if (-not (Test-Path quarantine-me.txt)) { throw 'Restore failed' }
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build NSIS installer
        working-directory: shield/desktop/src-tauri
        run: cargo tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: stannet-shield-windows-preview
          path: |
            shield/desktop/target/release/stannet-shield.exe
            shield/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
