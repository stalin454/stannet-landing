name: Shield Desktop Rust
on:
  pull_request:
    paths:
      - 'shield/desktop/**'
      - '.github/workflows/shield-desktop-rust.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: shield/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cargo check
      - name: Cargo test
        run: cargo test
      - name: Build release
        run: cargo build --release
      - name: Smoke test clean file and YARA-X fixture
        shell: pwsh
        run: |
          Set-Content -Path shield-clean.txt -Value 'StanNet Shield ordinary defensive smoke test'
          $clean = (& .\target\release\stannet-shield.exe shield-clean.txt) | ConvertFrom-Json
          if ($clean.status -ne 'no-rule-match') { throw 'Unexpected clean scanner status' }
          if ($clean.sha256.Length -ne 64) { throw 'Invalid SHA-256 output' }

          Set-Content -Path shield-yara.txt -Value 'STANNET_SHIELD_DEMO'
          $fixture = (& .\target\release\stannet-shield.exe shield-yara.txt) | ConvertFrom-Json
          if ($fixture.status -ne 'review') { throw 'YARA-X fixture did not trigger review status' }
          if ($fixture.matches -notcontains 'Shield_Demo') { throw 'Expected Shield_Demo rule match missing' }
          Write-Host ($fixture | ConvertTo-Json -Compress)
      - uses: actions/upload-artifact@v4
        with:
          name: stannet-shield-core-windows-x64
          path: shield/desktop/target/release/stannet-shield.exe
          if-no-files-found: error
