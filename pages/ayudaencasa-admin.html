<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Moderación | AyudaEnCasa</title><style>body{font:15px/1.5 system-ui;background:#f6f7f8;color:#172033;margin:0}main{max-width:1050px;margin:auto;padding:32px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin:12px 0}button{padding:9px 12px;margin:5px;border:0;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap}</style></head><body><main><h1>AyudaEnCasa · Moderación</h1><p id="status">Comprobando acceso…</p><div id="reports"></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,o={}){const r=await fetch('/api/ayudaencasa/v1'+path,{credentials:'same-origin',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error');return d}
async function load(){try{const me=await api('/me');if(!['ADMIN','MODERATOR'].includes(me.user.role))throw Error('Acceso restringido.');document.querySelector('#status').textContent='Sesión: '+me.user.email+' · '+me.user.role;const d=await api('/admin/reports');document.querySelector('#reports').innerHTML=d.reports.length?d.reports.map(x=>'<article class="card"><b>'+esc(x.reason)+'</b><p>'+esc(x.details)+'</p><small>'+esc(x.status)+' · '+esc(x.created_at)+'</small><div><button data-id="'+x.id+'" data-state="REVIEWING">Revisando</button><button data-id="'+x.id+'" data-state="RESOLVED">Resolver</button><button data-id="'+x.id+'" data-state="DISMISSED">Descartar</button></div></article>').join(''):'<p>No hay reportes pendientes.</p>';document.querySelectorAll('[data-state]').forEach(b=>b.onclick=async()=>{await api('/admin/reports/'+b.dataset.id,{method:'PATCH',body:JSON.stringify({status:b.dataset.state})});load()})}catch(e){document.querySelector('#status').textContent=e.message}}load();
</script></body></html>
